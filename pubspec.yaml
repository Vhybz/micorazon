name: mi_corazon
description: "Mi~Corazon Freshmeat Butchery Management System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.2
  supabase_flutter: ^2.6.0
  flutter_dotenv: ^5.2.1
  http: ^1.2.1
  image_picker: ^1.1.2
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.2.2
  font_awesome_flutter: ^10.7.0
  material_design_icons_flutter: ^7.0.7296
  permission_handler: ^11.3.1
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  connectivity_plus: ^6.0.3
  path_provider: ^2.1.3
  path: ^1.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  mobile_scanner: ^5.1.1
  url_launcher: ^6.3.0
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.16.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  msix: ^3.16.1

msix_config:
  display_name: Mi~Corazon Butchery
  publisher_display_name: Mi~Corazon Freshmeat
  title_bar_background_color: "#6B1111"
  logo_path: assets/logo/logo.jpg
  capabilities: internetClient, location, privateNetworkClientServer
  store: false

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  windows:
    generate: true
    image_path: "assets/logo/logo.jpg"
  image_path: "assets/logo/logo.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#6B1111"
  adaptive_icon_foreground: "assets/logo/logo.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/.env
    - assets/images/
    - assets/images/bgi/
    - assets/logo/
